<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5 col-md-8">
      <div class="glass p-5 rounded-4 shadow-lg">
        <div class="text-center mb-5">
          <div class="mx-auto mb-4 d-flex justify-content-center align-items-center" 
               style="width: 90px; height: 90px; background: linear-gradient(45deg, #eab308, #facc15); border-radius: 50%;">
            <span style="font-size: 45px;">📖</span>
          </div>
          <h2 class="text-white fw-bold">Connexion</h2>
          <p class="text-muted">Accédez à votre espace bibliothèque</p>
        </div>

        <form (ngSubmit)="onLogin()">
          <div class="mb-4">
            <input type="email" class="form-control form-control-lg bg-dark text-white border-warning" [(ngModel)]="email"
             name="email" placeholder="Email" required>
          </div>
          <div class="mb-4">
            <input type="password" class="form-control form-control-lg bg-dark text-white border-warning" [(ngModel)]="password"
             name="password" placeholder="Mot de passe" required>
          </div>

          <button type="submit" class="btn btn-warning btn-lg w-100 fw-bold">
            Se Connecter
          </button>
        </form>

        @if (error()) {
          <div class="alert alert-danger mt-4 text-center">{{ error() }}</div>
        }

        <div class="text-center mt-4">
          <p class="text-muted">
            Pas encore de compte ? 
            <a routerLink="/register" class="text-warning fw-bold">S'inscrire</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>


<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-5">
    <h1 class="display-5 fw-bold text-white">Administration</h1>
    <button class="btn btn-gold px-4 py-2" (click)="ajouterUtilisateur()">
      <i class="bi bi-plus-circle"></i> Ajouter un utilisateur
    </button>
  </div>

  <div class="glass rounded-4 p-4">
    <div class="table-responsive">
      <table class="table table-dark-custom table-hover align-middle">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nom Complet</th>
            <th>Email</th>
            <th>Rôle</th>
            <th>Statut</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          @for (user of utilisateurs(); track user.id) {
            <tr>
              <td><strong>#{{ user.id }}</strong></td>
              <td>{{ user.nom || '' }}</td>
              <td>{{ user.email }}</td>
              <td>
                <span class="badge bg-primary">{{ user.role }}</span>
              </td>
              <td>
                <span [class]="user.isActive ? 'badge bg-success' : 'badge bg-danger'">
                  {{ user.isActive ? 'Validé' : 'En attente' }}
                </span>
              </td>
              <td class="text-center">
                <div class="btn-group btn-group-sm" role="group">
                  @if (!user.isActive) {
                    <button class="btn btn-success" (click)="validerCompte(user.id!)">
                      Valider
                    </button>
                  }
                  <button class="btn btn-warning" 
                          [disabled]="!user.id"
                          (click)="changerRole(user.id!, Role.BIBLIOTHECAIRE)">
                    Biblio
                  </button>
                  <button class="btn btn-info" 
                          [disabled]="!user.id"
                          (click)="changerRole(user.id!, Role.ADMIN)">
                    Admin
                  </button>
                  <button class="btn btn-danger" 
                          (click)="supprimer(user.id!)">
                    Supprimer
                  </button>
                </div>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
